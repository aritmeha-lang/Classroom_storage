<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manajemen Kelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loader -->
  <div id="loader" class="d-none">
    <div class="text-center">
      <div class="spinner-border text-primary" style="width:3rem;height:3rem" role="status"></div>
      <p class="mt-3 fw-semibold text-secondary mb-0">Memuat data…</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toasts" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2100"></div>

  <!-- Login -->
  <section id="login" class="auth-bg d-none">
    <button class="btn btn-light rounded-circle theme-toggle auth-toggle" title="Ganti tema">
      <i class="bi theme-icon bi-moon-stars-fill"></i>
    </button>
    <div class="card border-0 shadow-lg rounded-4 auth-card fade-up">
      <div class="card-body p-4 p-md-5">
        <div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div>
        <h1 class="h4 fw-bold text-center mb-1">Selamat datang kembali</h1>
        <p class="text-secondary text-center mb-4">Masuk untuk mengelola kelas Anda</p>
        <form id="login-form" class="vstack gap-3">
          <div class="form-floating">
            <input id="lg-user" name="username" class="form-control" placeholder="Username" required autocomplete="username">
            <label for="lg-user">Username</label>
          </div>
          <div class="form-floating">
            <input id="lg-pass" name="password" type="password" class="form-control" placeholder="Password" required autocomplete="current-password">
            <label for="lg-pass">Password</label>
          </div>
          <button class="btn btn-primary btn-lg rounded-3 w-100 mt-2">Masuk <i class="bi bi-arrow-right ms-1"></i></button>
        </form>
      </div>
    </div>
  </section>

  <!-- Aplikasi -->
  <div id="app" class="d-none">
    <aside class="sidebar d-none d-lg-flex">
      <div class="d-flex align-items-center gap-3 mb-4 px-2">
        <img class="class-logo d-none" alt="">
        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <div class="lh-sm">
          <div class="class-name fw-bold">Kelas Saya</div>
          <small class="text-secondary">Manajemen Kelas</small>
        </div>
      </div>
      <nav id="nav-desktop"></nav>
    </aside>

    <!-- Menu mobile -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav">
      <div class="offcanvas-header">
        <div class="d-flex align-items-center gap-2">
          <img class="class-logo d-none" alt="" style="width:34px;height:34px">
          <span class="class-name fw-bold"></span>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup"></button>
      </div>
      <div class="offcanvas-body"><nav id="nav-mobile"></nav></div>
    </div>

    <main class="main">
      <header class="topbar d-flex align-items-center gap-3 px-3 px-lg-4 py-3">
        <button class="btn btn-light rounded-3 d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Menu">
          <i class="bi bi-list fs-5"></i>
        </button>
        <h1 id="page-title" class="h5 fw-bold mb-0 flex-grow-1"></h1>
        <button class="btn btn-light rounded-circle theme-toggle" title="Ganti tema">
          <i class="bi theme-icon bi-moon-stars-fill"></i>
        </button>
        <div class="dropdown">
          <button class="btn btn-light rounded-pill d-flex align-items-center gap-2 ps-1 pe-3 py-1" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="top-avatar"></span>
            <span class="text-start d-none d-md-block lh-sm">
              <span id="user-name" class="fw-semibold d-block small"></span>
              <small id="user-role" class="text-secondary"></small>
            </span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2">
            <li><a class="dropdown-item rounded-3" href="#profile"><i class="bi bi-person me-2"></i>Profil</a></li>
            <li><button class="dropdown-item rounded-3" onclick="formPass()"><i class="bi bi-shield-lock me-2"></i>Ubah password</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item rounded-3 text-danger" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button></li>
          </ul>
        </div>
      </header>
      <div id="view" class="content"></div>
    </main>
  </div>

  <!-- Modal form & konfirmasi -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="formModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body pt-3" id="formModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

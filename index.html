<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buku Kelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://www.santa-laurensia.com/sutera/wp-content/uploads/2024/10/cropped-logo-lss-11.png">
</head>
<body>

  <!-- Ikon: digambar sendiri sebagai SVG, tidak memuat apa pun dari internet -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 2 4 4.5"/></symbol>
      <symbol id="i-calcheck" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5l2 2 4-4"/></symbol>
      <symbol id="i-horn" viewBox="0 0 24 24"><path d="M4 10v4h3l8 4V6L7 10H4zM18 9c1 .8 1.5 1.8 1.5 3s-.5 2.2-1.5 3M7 14l1 5h3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v14"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m3 17 5-5 4 4 3-3 6 5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    </defs>
  </svg>

  <!-- Loader: buku-buku yang naik turun -->
  <div id="loader" class="d-none" role="status" aria-live="polite">
    <div class="text-center">
      <div class="shelf"><i></i><i></i><i></i><i></i></div>
      <p class="mt-3 mb-0 fw-bold">Sebentar, lagi menyiapkan…</p>
    </div>
  </div>

  <div id="toasts" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2100"></div>

  <!-- ===== Login ===== -->
  <section id="login" class="login d-none">
    <div class="login-art d-none d-lg-flex">
      <div class="brand-row">
        <span class="logo-box"><svg class="ic"><use href="#i-book"/></svg></span>
        <b class="display">Buku Kelas</b>
      </div>
      <div>
        <h1 class="art-title">Satu kelas,<br>satu buku<br>catatan.</h1>
        <p class="art-sub">Absensi, pengumuman, dan data siswa tersimpan rapi di satu tempat.</p>
      </div>
      <svg class="art" viewBox="0 0 380 230" aria-hidden="true">
        <line x1="10" y1="215" x2="370" y2="215" stroke-width="3" stroke-linecap="round"/>
        <rect x="40" y="180" width="230" height="35" rx="5" style="fill:var(--sky)" stroke-width="3"/>
        <path d="M70 180v35M240 180v35" stroke-width="3"/>
        <rect x="58" y="146" width="200" height="34" rx="5" style="fill:var(--pink)" stroke-width="3"/>
        <path d="M84 146v34M230 146v34" stroke-width="3"/>
        <rect x="48" y="112" width="215" height="34" rx="5" style="fill:var(--card)" stroke-width="3"/>
        <path d="M76 112v34M236 112v34" stroke-width="3"/>
        <g transform="rotate(24 320 120)">
          <rect x="304" y="30" width="30" height="150" rx="3" style="fill:var(--tomato)" stroke-width="3"/>
          <path d="M304 180h30l-15 34z" style="fill:var(--card)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M311 202h16l-8 12z" style="fill:var(--ink)" stroke="none"/>
          <path d="M304 52h30" stroke-width="3"/>
        </g>
        <circle cx="300" cy="46" r="5" style="fill:var(--mint)" stroke-width="3"/>
      </svg>
    </div>

    <div class="login-form-wrap">
      <button class="btn btn-plain icon-only theme-btn auth-toggle" title="Ganti tema" aria-label="Ganti tema">
        <svg class="ic"><use href="#i-moon"/></svg>
      </button>
      <form id="login-form" class="login-card fade-up">
        <div class="d-lg-none brand-row mb-4">
          <span class="logo-box"><svg class="ic"><use href="#i-book"/></svg></span>
          <b class="display">Buku Kelas</b>
        </div>
        <h2 class="display mb-1">Masuk dulu, yuk.</h2>
        <p class="text-muted-ink mb-4">Pakai username dan password dari wali kelas.</p>
        <div class="field mb-3">
          <label for="lg-user">Username</label>
          <input id="lg-user" name="username" class="form-control" required autocomplete="username">
        </div>
        <div class="field mb-4">
          <label for="lg-pass">Password</label>
          <input id="lg-pass" name="password" type="password" class="form-control" required autocomplete="current-password">
        </div>
        <button class="btn btn-ink w-100 py-2">Masuk <svg class="ic ms-1"><use href="#i-arrow"/></svg></button>
      </form>
    </div>
  </section>

  <!-- ===== Aplikasi ===== -->
  <div id="app" class="d-none">
    <div class="wrap">
      <header class="top">
        <div class="brand-row">
          <span class="logo-box"><img class="class-logo d-none" alt=""><svg class="ic brand-fallback"><use href="#i-book"/></svg></span>
          <div class="lh-1">
            <b class="display class-name d-block">Kelas Saya</b>
            <small class="text-muted-ink">Buku Kelas</small>
          </div>
        </div>
        <div class="flex-grow-1"></div>
        <button class="btn btn-plain icon-only theme-btn" title="Ganti tema" aria-label="Ganti tema">
          <svg class="ic"><use href="#i-moon"/></svg>
        </button>
        <div class="dropdown">
          <button class="who" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="top-avatar"></span>
            <span class="d-none d-md-block text-start lh-1">
              <b id="user-name" class="d-block"></b>
              <small id="user-role" class="text-muted-ink"></small>
            </span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#profile"><svg class="ic me-2"><use href="#i-user"/></svg>Kartu saya</a></li>
            <li><button class="dropdown-item" onclick="formPass()"><svg class="ic me-2"><use href="#i-lock"/></svg>Ubah password</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" onclick="logout()"><svg class="ic me-2"><use href="#i-out"/></svg>Keluar</button></li>
          </ul>
        </div>
      </header>

      <nav id="tabs" class="tabs d-none d-md-flex" aria-label="Menu utama"></nav>
      <main id="sheet" class="sheet"><div id="view"></div></main>
    </div>

    <nav id="dock" class="dock d-md-none" aria-label="Menu utama"></nav>
  </div>

  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title display" id="formModalTitle"></h5>
          <button type="button" class="btn btn-plain icon-only sm" data-bs-dismiss="modal" aria-label="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-body" id="formModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
